<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap');
html,body{margin:0;padding:0;}
body{background:#0A1230;}
.canvas{position:relative;width:2048px;height:2732px;overflow:hidden;background:#0A1230;}
.bg{position:absolute;inset:0;background-image:url('../../backgrounds/ipad-live-tv.png');background-size:cover;background-position:center;}
.bg-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,48,0.85) 0%,rgba(10,18,48,0.55) 18%,rgba(10,18,48,0) 34%),radial-gradient(ellipse 60% 22% at 50% 12%,rgba(10,18,48,0.5) 0%,rgba(10,18,48,0) 100%);}
.glow{position:absolute;left:50%;top:30%;width:1700px;height:1900px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(34,211,238,0.18) 0%,rgba(30,58,138,0.12) 40%,rgba(10,18,48,0) 70%);filter:blur(40px);}
.headline{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:128px;line-height:1.08;letter-spacing:-2px;color:#FFFFFF;margin:0;text-shadow:0 4px 24px rgba(0,0,0,0.55),0 0 60px rgba(34,211,238,0.25);}
.headline .accent{color:#22D3EE;text-shadow:0 4px 24px rgba(0,0,0,0.55),0 0 40px rgba(34,211,238,0.45);}
.device-shadow{filter:drop-shadow(0 40px 80px rgba(0,0,0,0.6)) drop-shadow(0 0 60px rgba(34,211,238,0.15));}
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="bg-tint"></div>
  <div class="glow"></div>
  <div style="position:absolute; top:0%; left:50%; width:78%; height:24%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; text-align:center;">
    <h1 class="headline">Always Know<br><span class="accent">What's On</span></h1>
  </div>
  <div class="device-shadow" style="position:absolute; left:50%; top:24%; width:74%; transform:translateX(-50%);">
    <div style="position:relative; aspect-ratio:2245/2930;">
      <div style="position:absolute; overflow:hidden; left:4.28%; top:3.48%; width:91.22%; height:93.24%; border-radius:1.4% / 1.0%;">
        <img src="../../captures/ipad/02-live-tv.png" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top;" draggable="false" />
      </div>
      <img src="https://r2-pub.rork.com/static/ipad-mockups/ipad-pro-13-space-gray-portrait.png" style="position:relative; z-index:10; display:block; width:100%; height:100%; pointer-events:none;" draggable="false" />
    </div>
  </div>
</div>
</body>
</html>
