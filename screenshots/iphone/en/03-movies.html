<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap');
html,body{margin:0;padding:0;background:#0A1230;}
.canvas{position:relative;width:1284px;height:2778px;overflow:hidden;background:#0A1230;}
.bg{position:absolute;inset:0;background-image:url('../../backgrounds/iphone-movies.png');background-size:cover;background-position:center;}
.bg-tint{position:absolute;inset:0;background:
radial-gradient(ellipse 70% 30% at 50% 10%, rgba(10,18,48,0.75) 0%, rgba(10,18,48,0) 100%),
linear-gradient(180deg, rgba(10,18,48,0.85) 0%, rgba(10,18,48,0.45) 22%, rgba(10,18,48,0) 45%),
radial-gradient(ellipse 60% 40% at 85% 85%, rgba(245,158,11,0.18) 0%, rgba(245,158,11,0) 70%);}
.headline{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:132px;line-height:1.05;letter-spacing:-2px;color:#FFFFFF;margin:0;text-shadow:0 4px 24px rgba(0,0,0,0.55),0 0 60px rgba(34,211,238,0.18);}
.headline .accent{background:linear-gradient(90deg,#FFE7B8 0%,#FBBF24 55%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,0.5));}
</style>
</head>
<body>
<div class="canvas">
<div class="bg"></div>
<div class="bg-tint"></div>
<div style="position:absolute; top:0%; left:50%; width:84%; height:22%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; text-align:center;">
<h1 class="headline">Every Film<br><span class="accent">In Focus</span></h1>
</div>
<div style="position:absolute; left:50%; top:22%; width:78%; transform:translateX(-50%);">
<div style="position:relative; aspect-ratio:879/1832;">
  <div style="position:absolute; overflow:hidden; left:4.32%; top:2.29%; width:91.47%; height:95.41%; border-radius:7.5% / 3.5%;">
    <img src="../../captures/iphone/03-movies.png" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top;" draggable="false" />
  </div>
  <img src="https://r2-pub.rork.com/static/iphone-mockups/iphone-17-pro-deep-blue.png" style="position:relative; z-index:10; display:block; width:100%; height:100%; pointer-events:none;" draggable="false" />
</div>
</div>
</div>
</body>
</html>
