<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap');
html,body{margin:0;padding:0;}
body{background:#0A1230;}
.canvas{position:relative;width:1284px;height:2778px;overflow:hidden;background:#0A1230;}
.bg{position:absolute;inset:0;background-image:url('../../backgrounds/iphone-live-tv.png');background-size:cover;background-position:center;}
.bg-overlay{position:absolute;inset:0;background:
radial-gradient(ellipse 70% 18% at 50% 11%, rgba(10,18,48,0.55) 0%, rgba(10,18,48,0) 100%),
linear-gradient(180deg, rgba(10,18,48,0.75) 0%, rgba(10,18,48,0.35) 22%, rgba(10,18,48,0) 40%, rgba(10,18,48,0.25) 100%);}
.glow{position:absolute;left:50%;top:58%;width:1100px;height:1500px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center, rgba(34,211,238,0.22) 0%, rgba(30,58,138,0.18) 40%, rgba(10,18,48,0) 70%);}
.headline{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:132px;line-height:1.05;letter-spacing:-2px;color:#FFFFFF;margin:0;text-shadow:0 4px 30px rgba(5,10,30,0.8),0 0 60px rgba(34,211,238,0.25);}
</style>
</head>
<body>
<div class="canvas">
<div class="bg"></div>
<div class="bg-overlay"></div>
<div class="glow"></div>
<div style="position:absolute; top:0%; left:50%; width:84%; height:22%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; text-align:center;">
<h1 class="headline">Know What's<br>On Now</h1>
</div>
<div style="position:absolute; left:50%; top:22%; width:78%; transform:translateX(-50%);">
<div style="position:relative; aspect-ratio:879/1832;">
  <div style="position:absolute; overflow:hidden; left:4.32%; top:2.29%; width:91.47%; height:95.41%; border-radius:7.5% / 3.5%;">
    <img src="../../captures/iphone/02-live-tv.png" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top;" draggable="false" />
  </div>
  <img src="https://r2-pub.rork.com/static/iphone-mockups/iphone-17-pro-deep-blue.png" style="position:relative; z-index:10; display:block; width:100%; height:100%; pointer-events:none;" draggable="false" />
</div>
</div>
</div>
</body>
</html>
