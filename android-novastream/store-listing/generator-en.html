<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NovaStream · Play listing screenshots (English)</title>
<style>
  @font-face { font-family: 'RobotoLocal'; src: url('__FONTS__/roboto.ttf'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'MaterialSymbolsRoundedLocal'; src: url('__FONTS__/material-symbols.ttf'); font-display: block; }
  @font-face { font-family: 'BricolageLocal'; src: url('__FONTS__/bricolage.ttf'); font-weight: 200 800; font-stretch: 75% 100%; font-display: block; }

  /* Dark scheme of the app (ui/theme/Theme.kt): NovaStream ships dark by default. */
  :root {
    --canvas: #0B0F1A;
    --surface: #151B29;
    --surfVar: #1E2532;
    --surfHigh: #1C222D;
    --ink: #F3F4F6;
    --ink2: #9CA3AF;
    --outline: #3A4353;
    --hair: #262D3A;
    --blue: #6E9BFF;
    --blueSoft: #1C2C4C;
    --onBlueSoft: #D9E4FF;
    --green: #3DDCA4;
    --greenSoft: #102A22;
    --onGreenSoft: #D3F7E8;
    --purple: #A79BF5;
    --purpleSoft: #241F45;
    --amber: #F5C518;
    --amberSoft: #33290A;
    --coral: #FF8A7A;
    --err: #F87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; font-family: 'RobotoLocal', sans-serif; }
  #root { display: flex; flex-direction: column; align-items: flex-start; gap: 40px; padding: 40px; }

  .ms {
    font-family: 'MaterialSymbolsRoundedLocal'; font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
    font-feature-settings: 'liga' 1; -webkit-font-smoothing: antialiased; flex: none;
  }

  .headlineMedium { font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: -0.4px; }
  .headlineSmall  { font-weight: 700; font-size: 22px; line-height: 28px; letter-spacing: -0.3px; }
  .titleLarge     { font-weight: 700; font-size: 20px; line-height: 26px; letter-spacing: -0.2px; }
  .titleMedium    { font-weight: 600; font-size: 16px; line-height: 22px; }
  .titleSmall     { font-weight: 600; font-size: 14px; line-height: 20px; }
  .bodyLarge      { font-weight: 400; font-size: 16px; line-height: 24px; }
  .bodyMedium     { font-weight: 400; font-size: 14px; line-height: 20px; }
  .bodySmall      { font-weight: 400; font-size: 12px; line-height: 16px; }
  .labelLarge     { font-weight: 600; font-size: 14px; line-height: 20px; }
  .labelMedium    { font-weight: 500; font-size: 12px; line-height: 16px; }
  .labelSmall     { font-weight: 500; font-size: 11px; line-height: 15px; }
  .ink2 { color: var(--ink2); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .grow { flex: 1; min-width: 0; }

  .ui { background: var(--canvas); color: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .ui.phone { width: 412px; height: 892px; }
  .ui.tv { width: 960px; height: 540px; flex-direction: row; }
  .ui.black { background: #000; color: #fff; }

  .statusbar { height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 500; color: var(--ink); position: relative; z-index: 3; }
  .statusbar .sbicons { display: flex; align-items: center; gap: 5px; }
  .scroll { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .pad20 { padding: 0 20px; }

  .navbar { height: 80px; flex: none; background: var(--surface); display: flex; align-items: center; padding-top: 12px; }
  .navitem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pill { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .pill.on { background: var(--greenSoft); }
  .navlabel { font-size: 12px; font-weight: 500; color: var(--ink2); }
  .navlabel.on { color: var(--ink); font-weight: 600; }
  .rail { width: 80px; flex: none; background: var(--surface); display: flex; flex-direction: column; align-items: center; padding-top: 24px; gap: 18px; }
  .rail .pill { width: 56px; }

  .card { background: var(--surface); border-radius: 16px; }
  .focusring { box-shadow: 0 0 0 2px #fff, 0 0 0 5px rgba(255,255,255,0.18); }

  /* home */
  .greet { border-radius: 24px; padding: 20px 18px;
    background: linear-gradient(120deg, rgba(110,155,255,0.34), rgba(167,155,245,0.26) 55%, rgba(255,138,122,0.22)); }
  .chip-playlist { background: rgba(21,27,41,0.78); border-radius: 14px; padding: 9px 12px; display: inline-flex; align-items: center; gap: 8px; }
  .catcard { display: flex; align-items: center; padding: 16px; border-radius: 16px; background-color: var(--surface); }
  .badge { border-radius: 15px; display: flex; align-items: center; justify-content: center; flex: none; }
  .arrowbox { width: 32px; height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
  .bar { border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; }

  .btn { height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.tonal { background: var(--greenSoft); color: var(--onGreenSoft); }
  .btn.outline { border: 1px solid var(--outline); color: var(--blue); }
  .btn.filled { background: var(--blue); color: #08132B; }
  .btn-resume { background: var(--blue); color: #08132B; border-radius: 22px; display: flex; align-items: center; gap: 12px; padding: 14px 20px; }

  .searchrow { display: flex; align-items: center; gap: 12px; padding: 8px 20px; flex: none; }
  .textfield { flex: 1; height: 60px; background: var(--surface); border-radius: 16px 16px 0 0; border-bottom: 1px solid var(--outline); display: flex; align-items: center; gap: 14px; padding: 0 16px; }
  .filterbtn { width: 60px; height: 60px; border-radius: 18px; background: var(--blueSoft); display: flex; align-items: center; justify-content: center; flex: none; }
  .chiprow { display: flex; gap: 8px; padding: 4px 20px; overflow: hidden; flex: none; }
  .chip { height: 32px; border-radius: 10px; border: 1px solid var(--outline); display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--ink); flex: none; white-space: nowrap; }
  .chip.sel { background: var(--greenSoft); color: var(--onGreenSoft); border-color: transparent; }
  .chip.selblue { background: var(--blueSoft); color: var(--onBlueSoft); border-color: transparent; }
  .chip.season { border-radius: 20px; height: 36px; font-weight: 600; }
  .chip.season.on { background: var(--blue); color: #08132B; border-color: transparent; }

  .chrow { padding: 12px 8px 4px 12px; }
  .logobox { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
  .chlogo { font-weight: 900; letter-spacing: -0.5px; color: #fff; font-size: 15px; line-height: 1; text-align: center; }
  .playbox { width: 36px; height: 36px; border-radius: 12px; background: var(--greenSoft); display: flex; align-items: center; justify-content: center; flex: none; }
  .heart { width: 36px; height: 36px; border-radius: 18px; background: var(--surfVar); display: flex; align-items: center; justify-content: center; flex: none; }
  .heart.on { background: rgba(248,113,113,0.18); }
  .guidebtn { border-radius: 10px; background: var(--surfVar); display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex: none; }

  .poster { border-radius: 16px; background: var(--surfVar) center/cover no-repeat; position: relative; overflow: hidden; flex: none; }
  .poster.focus { box-shadow: 0 0 0 3px #fff, 0 16px 34px rgba(0,0,0,0.55); transform: scale(1.05); }
  .postheart { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 15px; background: rgba(0,0,0,0.42); display: flex; align-items: center; justify-content: center; }

  .eprow { background: var(--surface); border-radius: 16px; display: flex; align-items: center; padding: 12px 14px; gap: 12px; }
  .epbadge { background: var(--surfVar); border-radius: 10px; padding: 7px 10px; color: var(--ink2); flex: none; }
  .appbar { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; }

  /* player */
  .still { position: absolute; inset: 0; background: center/cover no-repeat; }
  .playerTop { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px; z-index: 2; }
  .playerCenter { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
  .playerBottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 26px; z-index: 2; }
  .glassBtn { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .glassBtn .dot { width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.14); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
  .glassBtn.focused .dot { box-shadow: 0 0 0 2px #fff, 0 0 22px rgba(255,255,255,0.45); background: rgba(255,255,255,0.26); }
  .glassBtn .cap { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.82); }
  .bigBtn { width: 76px; height: 76px; border-radius: 38px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff, 0 0 26px rgba(255,255,255,0.4); }
  .upnext { position: absolute; background: rgba(0,0,0,0.82); border-radius: 20px; padding: 18px 22px; display: flex; flex-direction: column; color: #fff; z-index: 3; }
  .btn-sm { height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 0 20px; font-size: 14px; font-weight: 600; }
  .optpanel { position: absolute; top: 0; right: 0; bottom: 0; background: #101014; border-radius: 26px 0 0 26px; z-index: 4; display: flex; flex-direction: column; padding: 14px 14px 0; box-shadow: -20px 0 40px rgba(0,0,0,0.4); }
  .optsec { display: flex; align-items: center; gap: 8px; padding: 16px 10px 6px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0.4px; }
  .optrow { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; border-radius: 14px; color: #fff; }
  .optrow.sel { background: rgba(255,255,255,0.10); }
  .optrow.focus { box-shadow: 0 0 0 2px #fff; }

  /* settings / accounts */
  .switch { width: 52px; height: 32px; border-radius: 16px; background: var(--blue); display: flex; align-items: center; padding: 4px; flex: none; }
  .switch > i { width: 24px; height: 24px; border-radius: 12px; background: #08132B; display: block; margin-left: auto; }
  .radio { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--outline); flex: none; }
  .radio.on { border-color: var(--blue); background: radial-gradient(circle at center, var(--blue) 0 6px, transparent 6px); }
  .webcard { background: var(--surface); border: 1px solid rgba(110,155,255,0.35); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .codetile { border-radius: 12px; padding: 10px 12px; }
  .mono { font-family: 'RobotoLocal', monospace; font-variant-numeric: tabular-nums; }
  .qrpanel { background: #fff; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; align-items: center; color: #0B1220; }

  /* ---------- marketing phone slides ---------- */
  .slide { position: relative; overflow: hidden; }
  .slide.phone {
    width: 540px; height: 960px; display: flex; flex-direction: column; align-items: center; padding-top: 50px;
    background:
      radial-gradient(620px 440px at 50% 0%, var(--tint) 0%, transparent 70%),
      radial-gradient(520px 520px at 100% 100%, var(--tint2) 0%, transparent 70%),
      linear-gradient(180deg, #0A0E18 0%, #05070D 100%);
  }
  .slide.phone::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 6px 6px;
  }
  .brand { display: flex; align-items: center; gap: 8px; z-index: 2; margin-bottom: 18px; }
  .brand .gem { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  .brand span { font-family: 'BricolageLocal'; font-weight: 600; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
  .caption { width: 480px; text-align: center; z-index: 2; }
  .caption h2 { font-family: 'BricolageLocal'; font-stretch: 88%; font-size: 47px; line-height: 0.98; font-weight: 800; letter-spacing: -1.6px; color: #fff; }
  .caption h2 em { font-style: normal; color: var(--accent); }
  .caption p { margin: 14px auto 0; width: 430px; font-size: 17px; line-height: 1.38; color: #A9B3C7; }
  .device {
    margin-top: 30px; width: 352px; height: 748px; border-radius: 46px; background: #10141D; padding: 6px; z-index: 2;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 40px 80px rgba(0,0,0,0.6), 0 0 120px var(--glow);
  }
  .screen { width: 340px; height: 736px; border-radius: 40px; overflow: hidden; background: var(--canvas); }
  .screen .ui { transform: scale(0.8252427); transform-origin: top left; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ART = '__ART__';
const img = function (name) { return "url('" + ART + '/' + name + "')"; };

function ms(name, size, color, fill, extra) {
  return '<span class="ms" style="font-size:' + size + 'px;color:' + color + ";font-variation-settings:'FILL' " + (fill ? 1 : 0) + ",'wght' 400,'GRAD' 0,'opsz' 24;" + (extra || '') + '">' + name + '</span>';
}

function statusBar() {
  const c = '#F3F4F6';
  return '<div class="statusbar"><span>20:41</span><span class="sbicons">' +
    ms('signal_cellular_alt', 13, c, 1) + ms('wifi', 13, c, 1) + ms('battery_full', 13, c, 1) + '</span></div>';
}

const TABS = [['home', 'Home'], ['live_tv', 'Live'], ['movie', 'Movies'], ['tv', 'Series']];
function navItems(active) {
  return TABS.map(function (t, i) {
    const on = i === active;
    return '<div class="navitem"><div class="pill' + (on ? ' on' : '') + '">' + ms(t[0], 24, on ? 'var(--onGreenSoft)' : 'var(--ink2)', on) +
      '</div><span class="navlabel' + (on ? ' on' : '') + '">' + t[1] + '</span></div>';
  }).join('');
}
function bottomNav(active) { return '<div class="navbar">' + navItems(active) + '</div>'; }
function rail(active) { return '<div class="rail">' + navItems(active) + '</div>'; }

/* ---------------- content ---------------- */

const MOVIES = [
  ['Aurora Station', '2024', 'poster-aurora.jpg', true],
  ['Harbor Lights', '2023', 'poster-harbor.jpg', false],
  ['Neon Run', '2025', 'poster-neon.jpg', true],
  ['The Deep Blue', '2024', 'poster-ocean.jpg', false],
  ['Dune Road', '2022', 'poster-desert.jpg', false],
  ['The White Stag', '2021', 'poster-forest.jpg', false],
  ['Night Circuit', '2024', 'poster-racing.jpg', false],
  ['Winter Cabin', '2023', 'poster-mountain.jpg', false]
];

const CHANNELS = [
  ['Nova One HD', 'General', '20:30 Evening News', 0.62, true, ['N1', '#2563EB', '#7C3AED']],
  ['Planet Wild', 'Documentary', '20:10 Life in the Deep', 0.44, false, ['PW', '#059669', '#0EA5E9']],
  ['Sport Arena FHD', 'Sports', '20:45 Match of the Week', 0.18, true, ['SA', '#DC2626', '#F59E0B']],
  ['World News 24', 'News', '20:30 Night Briefing', 0.71, false, ['24', '#0F172A', '#475569']],
  ['Cinema Classic HD', 'Movies', '20:15 Director\u2019s Cut', 0.30, false, ['CC', '#B45309', '#7C2D12']],
  ['Kids Fun', 'Kids', '20:00 Cartoon Parade', 0.86, false, ['KF', '#DB2777', '#F59E0B']],
  ['Music Box', 'Music', '20:20 Top 40 Live', 0.52, false, ['MB', '#7C3AED', '#DB2777']]
];

const EPISODES = [
  ['S2E1', 'Signal from the North'],
  ['S2E2', 'Deep Waters'],
  ['S2E3', 'The Long Night'],
  ['S2E4', 'Collision Course'],
  ['S2E5', 'Homecoming']
];

/* ---------------- building blocks ---------------- */

function greetingHeader() {
  return '<div class="greet">' +
    '<div class="row" style="gap:8px"><div style="width:10px;height:10px;border-radius:5px;background:var(--green)"></div>' +
      '<span class="labelLarge" style="color:rgba(243,244,246,0.72)">NovaStream</span></div>' +
    '<div class="headlineMedium" style="margin-top:8px">Good evening</div>' +
    '<div style="margin-top:12px"><div class="chip-playlist">' + ms('playlist_play', 18, 'var(--green)', 1) +
      '<span class="titleSmall" style="color:var(--green)">Playlist: Home</span></div></div>' +
    '</div>';
}

function categoryCard(icon, title, count, accent, accentRgb, focused) {
  return '<div class="catcard' + (focused ? ' focusring' : '') + '" style="background-image:linear-gradient(90deg, rgba(' + accentRgb + ',0.22), rgba(' + accentRgb + ',0) 70%)">' +
    '<div class="badge" style="width:52px;height:52px;background:' + accent + '">' + ms(icon, 27, '#0B0F1A', 1) + '</div>' +
    '<div class="stack grow" style="margin-left:16px">' +
      '<div class="titleLarge" style="font-weight:600">' + title + '</div>' +
      '<div class="titleSmall" style="color:' + accent + '">' + count + '</div>' +
    '</div>' +
    '<div class="arrowbox" style="background:rgba(' + accentRgb + ',0.18)">' + ms('chevron_right', 20, accent) + '</div>' +
    '</div>';
}

function homeCards(focusFirst) {
  return categoryCard('live_tv', 'Live TV', '1.284 channels', 'var(--green)', '61,220,164', focusFirst) +
    categoryCard('movie', 'Movies', '612 titles', 'var(--blue)', '110,155,255', false) +
    categoryCard('tv', 'TV Series', '148 series', 'var(--purple)', '167,155,245', false);
}

function sectionHeader(title, action) {
  return '<div class="row" style="justify-content:space-between;padding-top:8px">' +
    '<span class="titleLarge">' + title + '</span>' +
    (action ? '<span class="labelLarge" style="color:var(--blue)">' + action + '</span>' : '') + '</div>';
}

function poster(m, w, opts) {
  const o = opts || {};
  const h = Math.round(w * 1.5);
  return '<div class="stack" style="width:' + w + 'px;flex:none">' +
    '<div class="poster' + (o.focus ? ' focus' : '') + '" style="width:' + w + 'px;height:' + h + 'px;background-image:' + img(m[2]) + '">' +
      (o.heart ? '<div class="postheart">' + ms('favorite', 16, m[3] ? 'var(--err)' : '#fff', m[3]) + '</div>' : '') +
    '</div>' +
    '<div class="titleSmall ellipsis" style="margin-top:' + (o.focus ? 14 : 8) + 'px">' + m[0] + '</div>' +
    '<div class="bodySmall ink2">' + m[1] + '</div></div>';
}

function continueCard(title, sub, fraction, art, pos, height) {
  return '<div class="stack" style="width:212px;flex:none">' +
    '<div style="height:' + (height || 120) + 'px;border-radius:16px;overflow:hidden;position:relative;background:' + img(art) + ' ' + (pos || 'center') + '/cover">' +
      '<div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,0.35)"><div style="height:4px;width:' + Math.round(fraction * 100) + '%;background:var(--blue)"></div></div>' +
    '</div>' +
    '<div class="titleSmall ellipsis" style="margin-top:8px">' + title + '</div>' +
    '<div class="bodySmall ink2 ellipsis">' + sub + '</div></div>';
}

function searchRow(placeholder) {
  return '<div class="searchrow"><div class="textfield">' + ms('search', 24, 'var(--ink2)') +
    '<div class="bodyLarge ink2 ellipsis grow">' + placeholder + '</div></div>' +
    '<div class="filterbtn">' + ms('filter_list', 26, 'var(--onBlueSoft)') + '</div></div>';
}

function chipRow(items, selClass) {
  return '<div class="chiprow">' + items.map(function (c) {
    return '<div class="chip' + (c[1] ? ' ' + selClass : '') + '">' + (c[1] ? ms('check', 18, 'currentColor') : '') + '<span>' + c[0] + '</span></div>';
  }).join('') + '</div>';
}

function channelRow(ch, focused) {
  const logo = ch[5];
  return '<div class="card' + (focused ? ' focusring' : '') + '">' +
    '<div class="row chrow">' +
      '<div class="row grow" style="gap:14px;padding:4px">' +
        '<div class="logobox" style="background:linear-gradient(135deg,' + logo[1] + ',' + logo[2] + ')"><div class="chlogo">' + logo[0] + '</div></div>' +
        '<div class="grow stack"><div class="titleSmall ellipsis">' + ch[0] + '</div>' +
          '<div class="bodySmall ink2 ellipsis" style="margin-top:2px">' + ch[1] + '</div></div>' +
        '<div class="playbox">' + ms('play_arrow', 22, 'var(--green)', 1) + '</div>' +
      '</div>' +
      '<div class="heart' + (ch[4] ? ' on' : '') + '" style="margin-left:6px">' + ms('favorite', 19, ch[4] ? 'var(--err)' : 'var(--ink2)', ch[4]) + '</div>' +
    '</div>' +
    '<div class="row" style="padding:0 12px 12px 16px;gap:10px">' +
      '<div class="grow stack">' +
        '<div class="row" style="gap:7px"><div style="width:7px;height:7px;border-radius:4px;background:var(--green)"></div>' +
          '<div class="bodySmall ellipsis">' + ch[2] + '</div></div>' +
        '<div class="bar" style="height:3px;background:var(--greenSoft);margin-top:6px"><div style="width:' + Math.round(ch[3] * 100) + '%;background:var(--green)"></div></div>' +
      '</div>' +
      '<div class="guidebtn">' + ms('calendar_month', 15, 'var(--ink2)') + '<span class="labelMedium ink2">TV guide</span></div>' +
    '</div></div>';
}

function resumeButton(focused) {
  return '<div class="btn-resume' + (focused ? ' focusring' : '') + '">' + ms('play_arrow', 26, '#08132B', 1) +
    '<div class="stack grow"><div class="titleMedium">Resume</div>' +
    '<div class="labelLarge ellipsis">S2E4 · Collision Course</div>' +
